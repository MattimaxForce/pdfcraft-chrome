<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body{margin:0;width:300px;font:13px system-ui,sans-serif;color:#222;background:#fff}
  @media (prefers-color-scheme:dark){body{background:#1f1f23;color:#e6e6e6}}
  header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid rgba(127,127,127,.25)}
  header img{width:32px;height:32px;border-radius:8px} header b{font-size:15px}
  label{display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer}
  label:hover{background:rgba(127,127,127,.12)}
  small{display:block;opacity:.65;font-size:11px}
  button{all:unset;box-sizing:border-box;display:block;width:calc(100% - 28px);margin:8px 14px;padding:8px 10px;text-align:center;
         border-radius:8px;background:#0a7563;color:#fff;cursor:pointer;font-weight:600}
  button:hover{background:#0c8d77} button.s{background:rgba(127,127,127,.2);color:inherit;font-weight:500}
  #file{padding:6px 14px;font-size:11.5px;opacity:.85}
  #file a{color:#0a7563;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<header><img src="icons/icon48.png" alt=""><div><b>PdfCraft</b><small data-i="popTagline"></small></div></header>
<label><input type="checkbox" id="auto"><span><span data-i="popAutoTitle"></span><small data-i="popAutoHint"></small></span></label>
<label><input type="checkbox" id="downloads"><span><span data-i="popDownloadsTitle"></span><small data-i="popDownloadsHint"></small></span></label>
<label><input type="checkbox" id="badge"><span><span data-i="popBadgeTitle"></span><small data-i="popBadgeHint"></small></span></label>
<div id="file"></div>
<button id="openLocal" data-i="popOpenLocal"></button>
<button id="native" class="s" data-i="popNative" style="display:none"></button>
<script src="popup.js"></script>
</body>
</html>
