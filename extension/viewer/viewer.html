<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PdfCraft</title>
  <link rel="icon" href="../icons/icon32.png">
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#f1f1f3;font:14px system-ui,sans-serif}
    @media (prefers-color-scheme:dark){html,body{background:#19191c;color:#ddd}}
    iframe{border:0;width:100%;height:100%;display:block}
    #msg{display:none;position:fixed;inset:0;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
    #msg div{max-width:520px;line-height:1.5}
    #msg h2{margin:0 0 8px}
    #msg code{background:rgba(127,127,127,.2);padding:2px 6px;border-radius:4px;user-select:all}
    #msg a{color:#0a7563}
  </style>
</head>
<body>
  <iframe id="app" title="PdfCraft" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
  <div id="msg"><div id="msgbody"></div></div>
  <script src="viewer.js"></script>
</body>
</html>
